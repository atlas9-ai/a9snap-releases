name: pages

# Deploys site/ (the built a9snap.com, written here by the site workflow in the private app repo; nobody edits
# it by hand) to GitHub Pages. The custom domain (a9snap.com) is set in this repo's Pages settings.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the site
        run: |
          for f in index.html 404.html CNAME robots.txt favicon.svg favicon-32.png apple-touch-icon.png og.png; do test -f "site/$f" || { echo "::error::site/$f is missing"; exit 1; }; done
          ! grep -rn '{{' site --include='*.html'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
